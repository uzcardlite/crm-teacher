name: Build Ustoz Release (APK + AAB)

# Manual only. Trigger from the Actions tab AFTER the signing secrets are set
# on THIS repo (uzcardlite/crm-teacher):
#   ANDROID_KEYSTORE_BASE64  (base64 of the upload keystore — the same one used
#                             for Farzandim is fine)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# The android/ project is generated fresh, so signing is injected via gradle
# properties instead of a committed build.gradle.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build web assets
        run: npm run build
        env:
          VITE_API_URL: https://crm-backend-production-49b2.up.railway.app

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode upload keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed release APK + AAB
        working-directory: android
        run: >
          ./gradlew assembleRelease bundleRelease
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore"
          -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD"
          -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS"
          -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload signed APK (direct / Telegram)
        uses: actions/upload-artifact@v4
        with:
          name: ustoz-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB (Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: ustoz-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
